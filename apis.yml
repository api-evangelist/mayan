aid: mayan
name: Mayan
description: 'Mayan is a Las Vegas, Nevada growth-automation platform for Amazon sellers,
  founded in 2020 and a Y Combinator W21 company. Its software pairs advertising optimization
  with inventory intelligence: automated Sponsored Products campaign creation, keyword and
  category targeting, competitor product targeting, placement adjustments, search expansion,
  pricing optimization, profit dashboards and replenishment alerts. It is sold self-serve as
  Copilot Lite (free) and the Smart Ads Platform, and as expert-managed Gold, Diamond and
  Enterprise engagements. Mayan is an official Amazon Ads partner and consumes Amazon''s
  Selling Partner and Advertising APIs; as of this profile it publishes no public API,
  developer portal, or machine-readable contract of its own.'
